<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="772" viewBox="0 0 1200 772" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">agent-pm system structure</title>
<desc id="d">Your Mac is the host. You talk to the manager, which starts workers through agent-pm-session; each session runs on a Host picked per session. On a Local Host, tmux or a pty, the client runs on the Mac as you, with your own logins: not isolated, auto mode. On the Docker Host, isolated and in yolo mode, the session code on the Mac asks agent-pm-broker to start and close the session's container and drives it over docker exec. The broker, root-owned on the Mac, reads the logins from the login keychain (the agent-pm-bot App private key, the Claude setup-token, the full Codex login), which only it can read; the App key and the Codex refresh token stay with it. Inside the Docker Desktop VM each start, restart or resume gets a new worker container, the isolation boundary: user agent, all capabilities dropped, no-new-privileges. At start the broker writes the container's own credentials to its /run/agent-pm/secrets tmpfs: GitHub installation tokens, one per installation, valid an hour and renewed; a Codex access token without its refresh token; a copy of the Claude setup-token. At close it revokes the GitHub tokens and the client credential is deleted with the container. The container works in a workspace volume that starts empty, cannot reach the host keychain, the Linear keys, the host gh login or the Docker socket, and its work reaches the Mac only through GitHub, where it clones, pushes and opens draft pull requests as agent-pm-bot[bot]. The broker's App key signs a 9-minute JWT for the installation tokens.</desc>
