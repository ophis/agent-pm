<rect x="1" y="1" width="1198" height="770" rx="22" fill="url(#bg)" stroke="#e2e8f0"/>
<text x="40" y="62" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start" letter-spacing="-0.3">agent-pm system structure</text>
<text x="40" y="90" font-size="14" fill="#64748b" font-weight="500" text-anchor="start">Each session runs on a Host you pick: on the Mac, or isolated in its own Docker container.</text>
<text x="40" y="112" font-size="14" fill="#64748b" font-weight="500" text-anchor="start">The broker keeps the logins in the login keychain and hands each container only its own credentials.</text>

