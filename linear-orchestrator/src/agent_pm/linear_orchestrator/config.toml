# DO NOT MODIFY this file. This deployment's settings go in ~/.agent-pm/config.local.toml, whose per-layer sections overlay each
# project's config.toml (layers and merge rules: utils/src/agent_pm/utils/config_file.py's docstring). Every key this
# file owns is a real line below: a required one you set locally has the placeholder "" (router, run and promote stop
# while one is still "" or missing), a local-only one its empty default; a `# local:` line shows a value to copy there,
# uncommented. [roles.<role>] merges over delegate/config.toml's (a lower level), key by key.

# Linear entities, by id.
#   team              local, required: the Linear team id
#   human_members     local: the human users' emails; each is subscribed to every issue moved to In Review; [] → none
#   harness_key       local, required: Keychain service of the harness account's Linear API key (router, promote, prune)
#   task_label_group  local, required: Linear id of the `Tasks` label group; its labels pick an issue's task through
#                     [task_labels]
#   work_dir          local: runtime state: agent runs' workdirs <work_dir>/work/<ID>/ (agent/, run/), router
#                     state and logs in <work_dir>/logs/; absolute or ~, neither in nor containing a [local_clones] clone
team = ""
human_members = []
harness_key = ""
task_label_group = ""
work_dir = "~/.agent-pm"
# local: [linear_orchestrator]
# local: team = "00000000-0000-0000-0000-000000000000"
# local: human_members = ["you@example.com"]
# local: harness_key = "linear-harness"
# local: task_label_group = "00000000-0000-0000-0000-000000000000"
# local: work_dir = "~/.agent-pm"

# Delegate implementations; default selects new runs. Recorded kinds select existing runs.
[delegates]
default = "harness"

[delegates.harness]
implementation = "agent_pm.delegate.engine.harness_delegate:HarnessDelegate"

# The team's workflow states the code uses.
#   <state>  local, required for each of todo, in_progress, in_review, handoff, done, canceled: its Linear state id
[states]
todo = ""
in_progress = ""
in_review = ""
handoff = ""
done = ""
canceled = ""

# local: [linear_orchestrator.states]
# local: todo        = "00000000-0000-0000-0000-000000000000"
# local: in_progress = "00000000-0000-0000-0000-000000000000"
# local: in_review   = "00000000-0000-0000-0000-000000000000"
# local: handoff     = "00000000-0000-0000-0000-000000000000"
# local: done        = "00000000-0000-0000-0000-000000000000"
# local: canceled    = "00000000-0000-0000-0000-000000000000"

# Task labels; optional: an issue without one runs its role, which picks a task from its index.
#   <task>  local: the task's Linear label id, a child of the Tasks group; empty table → none
[task_labels]

# local: [linear_orchestrator.task_labels]
# local: deep-research = "00000000-0000-0000-0000-000000000000"
# local: light-research = "00000000-0000-0000-0000-000000000000"
# local: build = "00000000-0000-0000-0000-000000000000"
# local: light-build = "00000000-0000-0000-0000-000000000000"

# A role to orchestrate. Its tasks are its charter's index (delegate/src/agent_pm/delegate/team/roles/<role>.md › Tasks).
# A role added in config.local.toml with any of these keys is orchestrated too.
#   account               local, required for each role: the role's Linear account (email)
#   key                   local, required: Keychain service of that account's API key
#   next                  the role promote hands this role's Handoff issues to; "" → the last stage
#   require_instructions  true → a Handoff issue with no human_members comment goes back to In Review; unset → true
#   max_runs              agent runs of this role at once; unset → 1
[roles.researcher]
account = ""
key = ""
next = "pm"
require_instructions = true
max_runs = 3

[roles.pm]
account = ""
key = ""
next = "engineer"
require_instructions = false       # a PRD carries enough context
max_runs = 3

[roles.engineer]
account = ""
key = ""
next = ""
require_instructions = true
max_runs = 3

# local: [linear_orchestrator.roles.researcher]
# local: account = "you+researcher@example.com"
# local: key = "linear-researcher"
# local: [linear_orchestrator.roles.pm]
# local: account = "you+pm@example.com"
# local: key = "linear-pm"
# local: [linear_orchestrator.roles.engineer]
# local: account = "you+engineer@example.com"
# local: key = "linear-engineer"
# local: max_runs = 1

# Project repos; optional.
#   "<project id>"  local: "<owner>/<name>": target repo of the Linear project's Engineering, research or
#                   product-design issues with no Repo: line; a Repo: line wins; empty table → none
[project_repos]

# local: [linear_orchestrator.project_repos]
# local: "00000000-0000-0000-0000-000000000000" = "<owner>/<name>"

# Local clones; optional, an unlisted repo gets a fresh clone.
#   "<owner>/<name>"  local: "<path>" (absolute or ~) of the repo's local clone. The input's Repo: line names the path,
#                     so the agent run gets a git worktree of the clone; load() checks it is a clone of that
#                     repo; empty table → none
[local_clones]

# local: [linear_orchestrator.local_clones]
# local: "<owner>/<name>" = "~/src/<name>"

# The overlay; optional: core run keys for the Linear orchestrator's agent runs, in delegate/config.toml's layout under
# [core], the last of delegate/config.toml's layers. {{pythonpath}} supplies the loaded packages' source import roots,
# shell-quoted; installed import roots need no PYTHONPATH. Use explicit paths for external files.
#   <run key>  as in delegate/config.toml, local keys included (e.g. a trusted cwd); users, trusted_dirs,
#              and [clients] tables are refused; a role table holding the old
#              task-level keys is an error
[core.roles.researcher]
# the gate is this installation's bin/ command: the router puts that bin/ on its runs' PATH
gate = "agent-pm-linear router --brake researcher"
# local: [linear_orchestrator.core.roles.researcher]
# local: cwd = "~/src/<name>"
