[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "UP", "B", "SIM", "I", "ERA001", "PLR0913", "C901", "PLR0911",
    "PLR0912", "PLR0915", "ARG001", "ARG004", "ARG005", "TID", "BLE", "TRY", "FBT",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["manager/src", "linear-orchestrator/src", "delegate/src", "session/src", "utils/src"]
extraPaths = ["manager/src", "linear-orchestrator/src", "delegate/src", "session/src", "utils/src"]

[tool.importlinter]
root_packages = ["agent_pm", "manager.tests", "orchestrator_tests", "delegate.tests", "session.tests", "utils.tests", "tests"]

[[tool.importlinter.contracts]]
name = "Production layers"
type = "layers"
layers = ["agent_pm.manager", "agent_pm.linear_orchestrator", "agent_pm.delegate", "agent_pm.session", "agent_pm.utils"]

[[tool.importlinter.contracts]]
name = "manager uses lower public packages"
type = "forbidden"
source_modules = ["agent_pm.manager", "manager.tests"]
forbidden_modules = ["agent_pm.linear_orchestrator.*", "agent_pm.delegate.*", "agent_pm.session.*", "agent_pm.utils.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "manager tests respect layer ownership"
type = "forbidden"
source_modules = ["manager.tests"]
forbidden_modules = ["tests"]

[[tool.importlinter.contracts]]
name = "linear_orchestrator uses lower public packages"
type = "forbidden"
source_modules = ["agent_pm.linear_orchestrator", "orchestrator_tests"]
forbidden_modules = ["agent_pm.delegate.*", "agent_pm.session.*", "agent_pm.utils.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "linear_orchestrator tests respect layer ownership"
type = "forbidden"
source_modules = ["orchestrator_tests"]
forbidden_modules = ["tests", "agent_pm.manager", "manager.tests"]

[[tool.importlinter.contracts]]
name = "delegate uses lower public packages"
type = "forbidden"
source_modules = ["agent_pm.delegate", "delegate.tests"]
forbidden_modules = ["agent_pm.session.*", "agent_pm.utils.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "delegate tests respect layer ownership"
type = "forbidden"
source_modules = ["delegate.tests"]
forbidden_modules = ["tests", "agent_pm.manager", "agent_pm.linear_orchestrator", "manager.tests", "orchestrator_tests"]

[[tool.importlinter.contracts]]
name = "session uses lower public packages"
type = "forbidden"
source_modules = ["agent_pm.session", "session.tests"]
forbidden_modules = ["agent_pm.utils.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "session tests respect layer ownership"
type = "forbidden"
source_modules = ["session.tests"]
forbidden_modules = ["tests", "agent_pm.manager", "agent_pm.linear_orchestrator", "agent_pm.delegate", "manager.tests", "orchestrator_tests", "delegate.tests"]

[[tool.importlinter.contracts]]
name = "utils tests respect layer ownership"
type = "forbidden"
source_modules = ["utils.tests"]
forbidden_modules = ["tests", "agent_pm.manager", "agent_pm.linear_orchestrator", "agent_pm.delegate", "agent_pm.session", "manager.tests", "orchestrator_tests", "delegate.tests", "session.tests"]

[[tool.importlinter.contracts]]
name = "Modes do not import the session API"
type = "forbidden"
source_modules = ["agent_pm.session.modes"]
forbidden_modules = ["agent_pm.session.engine.api"]

[tool.typos.files]
ignore-hidden = false

[tool.typos.default.extend-words]
# Escaped café filenames test Unicode handling.
caf = "caf"
# English ordinal suffix in 2nd, parsed by the runtime's reset-time protocol.
nd = "nd"
