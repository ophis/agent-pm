[tool.ruff]
target-version = "py311"
line-length = 100
per-file-target-version = { "core/src/tmux_host.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "ERA001"]
ignore = [
    "SIM105",  # try/except/pass is the repo's best-effort idiom; contextlib.suppress only adds an import (21 sites)
]

[tool.ruff.lint.per-file-ignores]
# B023: a test loop's closures (subTest cases, fakes) run within that iteration (74 sites)
# SIM117: merging nested `with` blocks would only reindent test bodies (19 sites)
"tests/**" = ["B023", "SIM117"]
"new/tests/**" = ["B023", "SIM117"]
# SIM115: the open() spy hands its file to the code under test, which closes it
"tests/unit/core/drive_test.py" = ["SIM115"]

[tool.ruff.lint.isort]
# Import side effects order these first: hermetic (tests/, new/tests/) sets HOME before code under test,
# config puts core/src on sys.path (root CLAUDE.md); the ticket removing import side effects drops them
sections = { hermetic = ["tests", "new.tests"], config = ["config"] }
section-order = ["future", "hermetic", "config", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
