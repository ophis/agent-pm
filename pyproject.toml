[tool.ruff]
target-version = "py311"
line-length = 100
per-file-target-version = { "new/core/src/agent_pm/driver/tmux_host.py" = "py39", "new/core/src/agent_pm/driver/modes/tui_hook.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "ERA001"]
ignore = [
    "E501",  # the formatter owns line length (100); the lines it can't wrap (strings, docstrings, comments) are a follow-up
    "SIM105",  # try/except/pass is the repo's best-effort idiom; contextlib.suppress only adds an import
]

[tool.ruff.lint.per-file-ignores]
# B023: a test loop's closures (subTest cases, fakes) run within that iteration
# SIM117: merging nested `with` blocks would only reindent test bodies
"new/tests/**" = ["B023", "SIM117"]
# B027: InProcess.check is an optional hook whose default does nothing
"new/core/src/agent_pm/adapters/base.py" = ["B027"]

[tool.ruff.format]
