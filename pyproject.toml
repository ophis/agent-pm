[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "UP", "B", "SIM", "I", "ERA001", "PLR0913", "C901", "PLR0911",
    "PLR0912", "PLR0915", "ARG", "TID", "BLE", "TRY", "FBT",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["manager/src", "linear-orchestrator/src", "delegate/src", "session/src", "utils/src"]
extraPaths = ["manager/src", "linear-orchestrator/src", "delegate/src", "session/src", "utils/src"]
