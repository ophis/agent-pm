# DO NOT MODIFY this file. This machine's settings go in ~/.agent-pm/config.local.toml, whose per-layer sections overlay each
# project's config.toml (layers and merge rules: utils/src/agent_pm/utils/config_file.py's docstring). Every key this
# file owns is a real line below; a `# local:` line shows a value to copy there, uncommented.
#
# The session's keys: [clients.<name>], [hosts] and [viewer]. The session reads no config file: each entry reads this
# file through agent_pm.session.read_config(), parses [hosts] once (Host.parse_hosts) and hands it to
# Session.configure_from; bin/agent-pm-session (session/src/agent_pm/session/cli.py) is one such entry.

# ── Clients ────────────────────────────────────────────
# [clients.<name>]  one table per client, loaded only by session/src/agent_pm/session/clients/registry.py; <name> is the
#                    client name a Spec's client names, independent of the module and class
#   implementation   required: "module.path:Class", the Client subclass that runs it
#   any other key    the client's own (its class's `keys`); a key it does not list is a config error
# [clients.<name>.modes]  its permission modes, auto and yolo (skips every permission and approval), each a list of
#                    flags added to every launch, a resume's included, after flags; an isolated Host's sessions get
#                    yolo's, every other's auto's. The only home of a client's permission flags: a mode holds none of
#                    another mode's flags; empty → none

# [clients.claude]  Claude Code (session/src/agent_pm/session/clients/claude/)
#   flags            claude flags added to every session command and its resume command; never --setting-sources (the
#                    session layer's); empty → none. Every --settings here and in a Spec, inline JSON or a settings
#                    file's path (relative to the session's cwd), merges into one. Default: agent-pm's own plugin
#                    (<plugin>@<marketplace>) stays off in every session, workers and role runs; the user's other plugins
#                    load. A local list replaces it whole
#   allow            tool rules pre-approved for every session (--allowedTools), after the run's commands and read
#                    rules; empty → none
#   env              variables added to every command's environment, over the client's defaults; empty → none
# [clients.claude.modes]    auto: Claude's auto mode classifier; yolo: bypassPermissions, its first-start dialog
#                            skipped (docs/sessions.md › Client policy)
# [clients.claude.tiers]    tier "1".."4" → its --model
# [clients.claude.efforts]  effort (low, medium, high, xhigh, max) → its --effort
#                            starting a run whose tier or effort has no entry here is a config error
[clients.claude]
implementation = "agent_pm.session.clients.claude:ClaudeClient"
flags = ["--settings", '{"enabledPlugins": {"agent-pm@agent-pm": false}}']
allow = []
# local: [session.clients.claude]
# local: allow = ["<rule>"]

[clients.claude.modes]
auto = ["--permission-mode", "auto"]
yolo = ["--dangerously-skip-permissions", "--settings", '{"skipDangerousModePermissionPrompt": true}']

[clients.claude.env]

[clients.claude.tiers]
1 = "fable"
2 = "opus"
3 = "sonnet"
4 = "haiku"

[clients.claude.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# [clients.codex]   Codex (session/src/agent_pm/session/clients/codex/)
#   flags            codex flags added before a Spec's to every new session; a resume keeps its own; empty → none.
#                    Default: as [clients.claude] flags'; the plugin id stays unquoted, or the key never matches
# [clients.codex.modes]  auto: no Codex sandbox, auto-reviewed approvals; yolo: no sandbox, no approvals. Neither
#                    grants a directory, hooks, session or cwd (docs/sessions.md › Client policy)
[clients.codex]
implementation = "agent_pm.session.clients.codex:CodexClient"
flags = ["-c", "plugins.agent-pm@agent-pm.enabled=false"]

[clients.codex.modes]
auto = ["-s", "danger-full-access", "-c", 'approval_policy="on-request"', "-c", 'approvals_reviewer="auto_review"']
yolo = ["--dangerously-bypass-approvals-and-sandbox"]

[clients.codex.tiers]
1 = "gpt-6-astra"
2 = "gpt-6.1-sol"
3 = "gpt-6-luna"
4 = "gpt-5.6-terra"

[clients.codex.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# Launch/probe variables, including CODEX_HOME; empty → none; resume keeps the saved CODEX_HOME.
[clients.codex.env]

# [clients.opencode]  OpenCode 1.x, headless and TUI (session/src/agent_pm/session/clients/opencode/); its models run
#                    on the host's Ollama, which stays on 127.0.0.1, or a [clients.opencode.providers] one. Each launch's
#                    OpenCode config (OPENCODE_CONFIG_CONTENT) holds the ollama provider at
#                    http://<the Host's address>:<ollama_port>/v1 and the configured providers, every other provider
#                    off (enabled_providers: OpenCode's built-in ones, OpenCode Zen's included), autoupdate off and
#                    permission.bash = "ask" (but a run's pre-approved commands): headless refuses the shell call, the
#                    TUI asks and the session is blocked. OpenCode runs any cwd's .opencode plugins and opencode.json
#                    (it has no project trust), so outside an isolated Host a launch, a resume's included, whose cwd is
#                    not trusted (Access.project) is refused before it starts (docs/sessions.md › OpenCode sessions)
#   flags            opencode flags added to every launch; never a session selector, --model, --format, --attach,
#                    --dir or a permission flag (modes'), nor for the TUI --prompt or --pure; empty → none
#   executable       the OpenCode 1.x command both modes run (a name PATH finds, or an absolute path); empty → the
#                    client's own name on PATH; a launch whose `<executable> --version` is not 1.x is refused
#   ollama_port      the host's Ollama port
#   model            the --model of a run without a tier (ollama/<model> or <name>/<model>, as tiers'); never empty,
#                    and without it such a run is refused
#   env              variables added to every launch; never one that overrides the launch's OpenCode config
#                    (OPENCODE_PERMISSION, OPENCODE_CONFIG, OPENCODE_CONFIG_DIR, OPENCODE_CONFIG_CONTENT); empty → none
# [clients.opencode.modes]    auto: none (bash asks); yolo: --auto, every permission granted
# [clients.opencode.tiers]    tier "1".."4" → its --model: ollama/<model> or <name>/<model> of a providers table, which
#                             lists the model; any other provider is refused
# [clients.opencode.providers.<name>]  an OpenAI-compatible provider (e.g. a LAN server; docs/sessions.md › OpenCode
#                    sessions), <name> up to 64 letters, digits, ., _ or -; none packaged:
#   base_url         its http(s) URL, ending /v1 (http://<host>:8080/v1)
#   models           model names it lists beside those tiers map to it; [] → only those
#                    Its API key: on tmux/pty, `opencode auth login` (provider <name>), which agent-pm never reads;
#                    on Docker, `agent-pm-broker login opencode <name>`, every listed one (docs/docker-host.md › OpenCode)
# [clients.opencode.efforts]  effort → its --variant (a model without that variant ignores it)
[clients.opencode]
implementation = "agent_pm.session.clients.opencode:OpenCodeClient"
flags = []
executable = ""
ollama_port = 11434
model = "ollama/qwen3.6:35b-mlx"

[clients.opencode.modes]
auto = []
yolo = ["--auto"]

[clients.opencode.env]

[clients.opencode.providers]

[clients.opencode.tiers]
1 = "ollama/qwen3.6:35b-mlx"
2 = "ollama/qwen3.6:35b-mlx"
3 = "ollama/qwen3.6:35b-mlx"
4 = "ollama/qwen3.6:35b-mlx"

[clients.opencode.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# ── Hosts ───────────────────────────────────────────────
# [hosts]             default: the [hosts.<name>] sessions run on
# [hosts.<name>]      one table per Host, parsed only by Host.parse_hosts (session/src/agent_pm/session/hosts/base.py)
#   implementation    required: "module.path:Class", the Host class; checked for that form only, never loaded there
#   isolated          true → an isolation boundary (a container): its sessions' clients run in yolo mode
#                     ([clients.<name>.modes]); false → auto mode
# [hosts.tmux]
#   status_line       true → tui sessions show tmux's status line
# [hosts.pty]         a pty per session, held by its own supervisor; state in ~/.agent-pm/pty/<name>/; cannot show:
#   outer_terminal    variables of an enclosing terminal a tui program on the pty never gets (its TERM: xterm-256color)
# [hosts.docker]      each tui session in its own container, made by agent-pm-broker (docs/docker-host.md):
#   docker            the docker CLI, an absolute path
#   plugins           the account's installed plugins every container's image holds, by name or name@marketplace; []: none
#   github.app        the GitHub App whose installation tokens every Docker session gets; "": none
[hosts]
default = "tmux"

[hosts.tmux]
# TmuxHost (session/src/agent_pm/session/hosts/tmux/host.py)
implementation = "agent_pm.session.hosts.tmux:TmuxHost"
status_line = false
isolated = false
# local: [session.hosts.tmux]
# local: status_line = true

[hosts.pty]
# PtyHost (session/src/agent_pm/session/hosts/pty/host.py)
implementation = "agent_pm.session.hosts.pty:PtyHost"
outer_terminal = ["TMUX", "TMUX_PANE"]
isolated = false

[hosts.docker]
# DockerHost (session/src/agent_pm/session/hosts/docker/host.py)
implementation = "agent_pm.session.hosts.docker.host:DockerHost"
docker = "/usr/local/bin/docker"
plugins = ["autopilot"]
isolated = true

[hosts.docker.github]
app = "agent-pm-bot"

# ── Viewer ──────────────────────────────────────────────
# [viewer]            how the Viewer (session/src/agent_pm/session/viewer/viewer.py) shows every Host's sessions:
#   workers_per_column panes per tmux grid column, 1..9999
#   grid_retile       when a tmux grid re-tiles: "open-close" (a pane opens or closes), "all" (also a drag or a
#                     window resize), "off" (never by itself: agent-pm-session tile @N)
[viewer]
workers_per_column = 3
grid_retile = "open-close"
# local: [session.viewer]
# local: workers_per_column = 2
# local: grid_retile = "all"
