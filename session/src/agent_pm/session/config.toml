# DO NOT MODIFY this file. This machine's settings go in ~/.agent-pm/config.local.toml, whose per-layer sections overlay each
# project's config.toml (layers and merge rules: utils/src/agent_pm/utils/config_file.py's docstring). Every key this
# file owns is a real line below; a `# local:` line shows a value to copy there, uncommented.
#
# The session's keys: [adapters.<name>] and [hosts]. The session reads no config file: each entry reads this file
# through agent_pm.session.read_config(), parses [hosts] once (Host.parse_hosts) and hands both to
# Session.configure(adapters=, hosts=); bin/agent-pm-session (session/src/agent_pm/session/cli.py) is one such entry.

# ── Adapters ────────────────────────────────────────────
# [adapters.<name>]  one table per client, loaded only by session/src/agent_pm/session/adapters/registry.py; <name> is the
#                    client name a Spec's client names, independent of the module and class
#   implementation   required: "module.path:Class", the Adapter subclass that runs it
#   any other key    the adapter's own (its class's `keys`); a key it does not list is a config error

# [adapters.claude]  Claude Code (session/src/agent_pm/session/adapters/claude/)
#   flags            claude flags added to every session command; never --setting-sources (the session layer's); empty → none.
#                    Its --settings and a Spec's merge into one. Default: agent-pm's own plugin (<plugin>@<marketplace>)
#                    stays off in every session, workers and role runs; the user's other plugins load. A local list
#                    replaces it whole
#   allow            tool rules pre-approved for every session (--allowedTools), after the run's commands and read
#                    rules; empty → none
#   env              variables added to every command's environment, over the adapter's defaults; empty → none
# [adapters.claude.tiers]    tier "1".."4" → its --model
# [adapters.claude.efforts]  effort (low, medium, high, xhigh, max) → its --effort
#                            starting a run whose tier or effort has no entry here is a config error
[adapters.claude]
implementation = "agent_pm.session.adapters.claude:ClaudeAdapter"
flags = ["--settings", '{"enabledPlugins": {"agent-pm@agent-pm": false}}']
allow = []
# local: [session.adapters.claude]
# local: allow = ["<rule>"]

[adapters.claude.env]

[adapters.claude.tiers]
1 = "fable"
2 = "opus"
3 = "sonnet"
4 = "haiku"

[adapters.claude.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# [adapters.codex]   Codex (session/src/agent_pm/session/adapters/codex/)
#   flags            codex flags added before a Spec's to every new session; a resume keeps its own; empty → none.
#                    Default: as [adapters.claude] flags'; the plugin id stays unquoted, or the key never matches
[adapters.codex]
implementation = "agent_pm.session.adapters.codex:CodexAdapter"
flags = ["-c", "plugins.agent-pm@agent-pm.enabled=false"]

[adapters.codex.tiers]
1 = "gpt-6-astra"
2 = "gpt-6.1-sol"
3 = "gpt-6-luna"
4 = "gpt-5.6-terra"

[adapters.codex.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# Launch/probe variables, including CODEX_HOME; empty → none; resume keeps the saved CODEX_HOME.
[adapters.codex.env]

# ── Hosts ───────────────────────────────────────────────
# [hosts]             default: the [hosts.<name>] sessions run on
# [hosts.<name>]      one table per Host, parsed only by Host.parse_hosts (session/src/agent_pm/session/hosts/base.py)
#   implementation    required: "module.path:Class", the Host class; checked for that form only, never loaded there
# [hosts.tmux]        tmux's display keys:
#   status_line       true → tui sessions show tmux's status line
#   workers_per_column panes per tmux grid column (the tmux Host's show), 1..9999
#   grid_retile       when a tmux grid re-tiles: "open-close" (a pane opens or closes), "all" (also a drag or a
#                     window resize), "off" (never by itself: agent-pm-session tile @N)
[hosts]
default = "tmux"

[hosts.tmux]
# TmuxHost (session/src/agent_pm/session/hosts/tmux/host.py)
implementation = "agent_pm.session.hosts.tmux:TmuxHost"
status_line = false
workers_per_column = 3
grid_retile = "open-close"
# local: [session.hosts.tmux]
# local: status_line = true
# local: workers_per_column = 2
# local: grid_retile = "all"
