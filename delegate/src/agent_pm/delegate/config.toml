# DO NOT MODIFY this file. This machine's settings go in ~/.agent-pm/config.local.toml, whose per-layer sections overlay each
# project's config.toml (layers and merge rules: utils/src/agent_pm/utils/config_file.py's docstring). Every key this
# file owns is a real line below, a key you set only locally with its empty default; a `# local:` line shows a value
# to copy there, uncommented. A table cannot drop a key this file sets, so a local [delegate.output] keeps this file's other
# keys in that table.
#
# Each layer reads only its own keys (paths from the repo root): the Composer (delegate/src/agent_pm/delegate/composer/)
# the run keys, [output], [roles.<role>], trusted_dirs and team_dirs; delegate/src/agent_pm/delegate/team/tools/repo.py
# users and trusted_dirs; delegate/src/agent_pm/delegate/config.py [delegates]; the Delegate
# (delegate/src/agent_pm/delegate/engine/plan.py) [policy.<client>]. [adapters] and [hosts]: session/src/agent_pm/session/config.toml.
#
# A run key's value resolves in order, each step replacing what the earlier ones set:
#   layers  this file (config.local.toml on top) → each overlay the caller passes, in order (the orchestrator's among
#           them); so a later layer's global value beats an earlier layer's role value
#   levels  within a layer: global → role ([roles.<role>])

# ── Global ──────────────────────────────────────────────
#   tier            required: model tier 1–4 (1 = strongest); the client's Adapter maps it to a model
#   effort          required: low | medium | high | xhigh | max; the client's Adapter maps it to its own effort value
#   client          required: the Adapter that runs the agent run (an [adapters.<name>] name); the orchestrator's
#                   overlay may set it per role. The Composer passes it through unchecked
#   language        the language reports and PRDs are written in (one line); "" → no rule: the model's default
#   cwd             the dir the agent run starts in (absolute or ~ path); "" → <workdir>/agent. A resume reuses
#                   its recorded one (<workdir>/run/run.jsonl)
#   idle_timeout    positive finite seconds without a session event. In tui mode the run gives up, leaving the
#                   session open; other modes record the idle event and continue
#   show            how a started tui session is shown, when its Host can display: "" → a pane (the tmux Host: in
#                   the display's grid or split); "none" → nothing, the attach command printed; else a one-line shell
#                   command run instead, {{session}} the session name
#   users           local, global only: GitHub logins whose PR comments are the user's; [] → the gh login
#   trusted_dirs    local, global only: dirs you trust (absolute or ~ path, matched by real path); [] → none. A cwd
#                   that is one or under one loads its project settings; any other, user settings only, with a stderr
#                   notice unless it is the workdir; a trusted cwd in the workdir is refused. A listed local clone's
#                   worktrees check out symlinks as links; every other checkout gets core.symlinks=false. A listed
#                   clone trusts every link in fetched origin/<branch> commits, which may point outside the worktree:
#                   list only stable paths only you write. An agent run cannot add one (no flag; the overlay rejects it)
#   team_dirs       local, global only: dirs of your own roles, tasks and templates (absolute or ~ path, matched by
#                   real path), read in order after core's team/; [] → none; never found from the cwd. Each may hold
#                   roles/, tasks/ and templates/ (each optional) of <name>.md files ([a-z0-9-] names) in team/'s
#                   formats (delegate/src/agent_pm/delegate/composer/__init__.py's docstring). Add-only: a name core or another team dir
#                   defines stops the run, naming both files, so no team dir file changes or extends a core role. A team
#                   dir's role needs no [roles.<role>] (unset: the global run keys); any role's templates may name any
#                   template. It may also hold tools/, files its roles' commands run as <role team>/tools/… (the
#                   config's {{role_team}}), trusted as its text is. A team dir is refused when it, its subdirs or
#                   files (by real path) or anything in its tools/ tree (links followed) lie in a temp dir, overlap
#                   the workdir, the cwd, a write dir, another dir the run adds to write or a dir the client can
#                   write (Codex: its CODEX_HOME); when it, its subdirs or files (not tools/) are writable by group
#                   or others, or are not yours; or a parent dir of it is writable by group or others (not sticky)
#                   or owned by neither you nor root (delegate/src/agent_pm/delegate/engine/plan.py)
#   templates, read, write, commands, gate  as in Roles below, for a role that does not set its own; [] or "" → none
tier = 2
effort = "high"
client = "claude"
language = "English"
templates = []
read = []
write = []
commands = []
gate = ""
cwd = ""
idle_timeout = 7200
show = ""
users = []
trusted_dirs = []
team_dirs = []
# local: [delegate]
# local: language = "Chinese"
# local: cwd = "~/src/<name>"
# local: users = ["octocat"]
# local: trusted_dirs = ["~/src/<name>"]
# local: team_dirs = ["~/.agent-pm/team"]

# Destination; a lower level's [output] replaces the whole table.
#   type    required: github (publish to repo, branch, dir) | local (save to the caller's out path) | pull-request (a PR
#           on the target repo) | orchestrator (return it through the outcome only)
#   repo    github: required; <owner>/<name>
#   branch  github: required
#   dir     github: required; the folder in the repo
#   host    github: "" → github.com; set for GitHub Enterprise, e.g. "ghe.example.com"
# A key "" is unset. The orchestrator needs researcher's and pm's [output] on one github.com repo and branch (local:
# below).
[output]
type = "local"
repo = ""
branch = ""
dir = ""
host = ""

# Roles: [roles.<role>], a role's run keys; its tasks are its charter's index (core's team/roles/<role>.md › Tasks). A
# role table holding the old task-level keys is an error (root README › Upgrading).
#   templates     names of team/templates/*.md inlined into the prompt; [] → none
#   read          extra dirs the agent run needs to read; `repo` is the caller's repo dir, {{team}} core's team/,
#                 {{role_team}} the role's team root (its team dir: team_dirs; core's team/ for a core role);
#                 the role's tasks dir (core's team/tasks/, or a team dir's: team_dirs) is always
#                 included; [] → none. Read-only: never --add-dir. Claude gets a Read(//<dir>/**) allow rule each
#                 (Read; Grep and Glob best-effort), so a file-tool write there is denied headless (-p) and prompts in
#                 tui mode, but under the shipped --permission-mode auto goes to Claude's classifier; a broad dir such
#                 as ~ pre-approves reads of its whole tree; a path with any of *?[]{}()\, refuses the run. Codex adds
#                 nothing (no read-only grant usable with -s): its workspace-write sandbox reads the whole disk; the
#                 default danger-full-access can write there too (README.md › Client policy). A dir also in write,
#                 or inside the cwd, <workdir>/agent or a write dir, stays writable; shell commands can write there
#                 regardless
#   write         extra dirs the agent run needs to write; <workdir>/agent is always reachable; [] → none
#   commands      requested shell commands (a trailing ` *` matches any arguments); the client's Adapter decides how
#                 they are approved. {{workdir}} is <workdir>/agent, {{team}} core's team/ dir, {{role_team}}
#                 as in read; a word holding one is shell-quoted once filled, and a prompt text writing the command
#                 with <Workdir>, <team> or <role team> gets it as approved when that quoting changed it; [] → none
#   gate          a usage-gate command the researcher runs before a costly step (deep research: before a second
#                 round); its approval follows the client's Adapter; "" → none (the orchestrator's overlay sets it)
#   <run key>     tier, effort, client, language, cwd, idle_timeout, show or [output], for that role

# ── Researcher ──────────────────────────────────────────
[roles.researcher]
templates = ["research-report"]
read = ["{{team}}"]
commands = ["python3 -P {{team}}/tools/repo.py worktree --dir {{workdir}}/src *"]
# local: [delegate.roles.researcher]
# local: cwd = "~/src/<name>"
# local: [delegate.roles.researcher.output]
# local: type = "github"
# local: repo = "<owner>/<name>"
# local: branch = "main"
# local: dir = "Research/"

# ── PM ──────────────────────────────────────────────────
[roles.pm]
templates = ["prd"]
commands = ["python3 -P {{team}}/tools/repo.py worktree --dir {{workdir}}/src *"]
# local: [delegate.roles.pm.output]
# local: type = "github"
# local: repo = "<owner>/<name>"
# local: branch = "main"
# local: dir = "Product Design/"

# ── Engineer ────────────────────────────────────────────
[roles.engineer]
effort = "xhigh"
commands = ["python3 -P {{team}}/tools/repo.py worktree --dir {{workdir}}/src *", "python3 -P {{team}}/tools/repo.py status --dir {{workdir}}/src *"]

[roles.engineer.output]
type = "pull-request"

# ── Dummy Tester ────────────────────────────────────────
[roles.dummy-tester]
tier = 3
effort = "low"

# [delegates]
#   harness_host  the [hosts.<name>] (session/src/agent_pm/session/config.toml) the harness runs on; "" → the agent's Host
[delegates]
harness_host = ""

# [policy.<client>]   a role run's flags and env, the Delegate's (README.md › Client policy); in claude's
#                     --settings, this core's own plugin (<plugin>@<marketplace>) stays off, the user's others load
[policy.claude]
flags = [
  "--permission-mode",
  "auto",
  "--strict-mcp-config",
  "--settings",
  '{"enabledPlugins": {"agent-pm@agent-pm": false}}',
]

[policy.codex]
flags = ["-s", "danger-full-access", "-c", 'approval_policy="on-request"', "-c", 'approvals_reviewer="auto_review"']
