# Jev, the System One decision API JevSelector asks (docs/architecture.md › Resolver chain); a self-hosted System One
# compatible server works too.
#   key      Keychain service of the Jev API key (docs/credentials.md); config holds only its name, never the key
#   url      the System One endpoint: https, or http on a loopback IP
#   model    the model each question names: one with a documented window (https://docs.typesafe.ai/models.md), a key of
#            WINDOWS in selector/src/agent_pm/selector/backends/jev.py (jev-1.13.0, jev-1.14.0, jev-latest, jev-preview)
#   timeout  seconds for the key lookup and for the request, each
[jev]
key = "typesafe-jev"
url = "https://api.typesafe.ai/v1/systemone"
model = "jev-1.13.0"
timeout = 2.0

# local: [selector.jev]
# local: url = "http://127.0.0.1:8000/v1/systemone"
