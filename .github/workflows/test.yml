name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comment-budget:
    name: Comment budget v2.0 (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}/core/src:${{ github.workspace }}/linear-orchestrator/src
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Comment budget
        run: python3 .github/comment_budget.py
      - name: Integration job assignment
        run: python3 .github/integration_jobs.py --check
      - name: .github tests
        run: python3 -m unittest discover -v -s .github -p "*_test.py"

  ruff:
    name: Ruff v2.0 (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        id: ruff
        run: pip install ruff==0.16.9
      - name: Ruff check
        run: ruff check --output-format=github
      - name: Ruff format
        if: ${{ !cancelled() && steps.ruff.outcome == 'success' }}
        run: ruff format --check

  unit:
    name: Unit tests v2.0 (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/core/src:${{ github.workspace }}/linear-orchestrator/src
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests/unit -t . -p "*_test.py"

  integration:
    name: Integration ${{ matrix.job }} v2.0 (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        job: ["driver", "adapters", "delegate-composer", "orchestrator", "crew-1", "crew-2", "crew-3", "shared"]
    env:
      PYTHONPATH: ${{ github.workspace }}/core/src:${{ github.workspace }}/linear-orchestrator/src
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
      - name: Integration tests
        run: python3 .github/integration_jobs.py '${{ matrix.job }}'
