name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Orchestrator tests
        run: python3 -m unittest discover -s orchestrator/src/tests -p "*_test.py"
      - name: Core tests
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 -m unittest discover -s core/src/tests -p "*_test.py"
      - name: Tmux skill script tests
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 -m unittest discover -s core/skills/tmux/scripts -p "*_test.py"

  integration-core:
    name: Core integration (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
      - name: Core integration tests
        run: python3 -m unittest discover -v -s core/src/tests/integration -p "*_integration_test.py"

  integration-orchestrator:
    name: Orchestrator integration (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Orchestrator integration tests
        run: python3 -m unittest discover -v -s orchestrator/src/tests/integration -p "*_integration_test.py"

  integration-tmux:
    name: Tmux integration (${{ matrix.shard }}, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: A
            tests: crew_integration_test.Grid crew_integration_test.Lifecycle crew_integration_test.Splits
          - shard: B
            tests: crew_integration_test.Roster
          - shard: C
            tests: crew_integration_test.Retile crew_integration_test.Managers crew_integration_test.Settle
    defaults:
      run:
        working-directory: core/skills/tmux/scripts/integration
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
      - name: Tmux skill integration tests
        env:
          TEST_CLASSES: ${{ matrix.tests }}
        run: python3 -m unittest -v $TEST_CLASSES

  integration:
    name: Integration tests (Python 3.11)
    if: ${{ always() }}
    needs: [integration-core, integration-orchestrator, integration-tmux]
    runs-on: ubuntu-latest
    steps:
      - name: Check integration results
        env:
          CORE_RESULT: ${{ needs.integration-core.result }}
          ORCHESTRATOR_RESULT: ${{ needs.integration-orchestrator.result }}
          TMUX_RESULT: ${{ needs.integration-tmux.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$ORCHESTRATOR_RESULT" = success
          test "$TMUX_RESULT" = success
