name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comment-budget:
    name: Comment budget (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Comment budget
        run: python3 .github/comment_budget.py

  ruff:
    name: Ruff (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        id: ruff
        run: pip install ruff==0.16.9
      - name: Ruff check
        run: ruff check --output-format=github
      - name: Ruff format
        if: ${{ !cancelled() && steps.ruff.outcome == 'success' }}
        run: ruff format --check

  new-unit:
    name: New core unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/new/core/src
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0   # real_test compares the root core/team/ with main
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: New core unit tests
        run: python3 -m unittest discover -s new/tests/unit -t . -p "*_test.py"

  new-integration:
    name: New core integration (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/new/core/src
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
      - name: New core integration tests
        run: python3 -m unittest discover -v -s new/tests/integration -t . -p "*_test.py"
