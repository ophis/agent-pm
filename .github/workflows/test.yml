name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMPORT_LINTER_VERSION: "2.15"
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.github:${{ github.workspace }}/manager/src:${{ github.workspace }}/linear-orchestrator/src:${{ github.workspace }}/delegate/src:${{ github.workspace }}/session/src:${{ github.workspace }}/utils/src:${{ github.workspace }}/linear-orchestrator/tests
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned tools
        run: python3 -m pip install ruff==0.16.9 pyright==1.1.414 import-linter=="$IMPORT_LINTER_VERSION" pylint==4.1.3 vulture==2.16 coverage==7.10.7
      - name: Comment budget
        run: python3 .github/comment_budget.py
      - name: Ruff
        if: ${{ !cancelled() }}
        run: |
          ruff check --no-cache --output-format=github
          ruff format --check --no-cache
      - name: Pyright
        if: ${{ !cancelled() }}
        run: pyright
      - name: Import contracts
        if: ${{ !cancelled() }}
        run: lint-imports --no-cache
      - name: Pylint
        if: ${{ !cancelled() }}
        run: pylint --disable=all --enable=cyclic-import,duplicate-code manager/src linear-orchestrator/src delegate/src session/src utils/src
      - name: Vulture
        if: ${{ !cancelled() }}
        run: vulture
      - name: Repository design and test boundaries
        if: ${{ !cancelled() }}
        run: python3 -m tests.checks
      - name: Protect shipped source
        if: ${{ !cancelled() }}
        run: chmod -R a-w manager/src linear-orchestrator/src delegate/src session/src utils/src
      - name: Repository integration tests
        if: ${{ !cancelled() }}
        run: python3 -X faulthandler .github/run_tests.py 'Repository integration' tests/integration
      - name: Require unchanged checkout
        if: ${{ always() }}
        run: |
          status=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null status --porcelain)
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: Integration duration assignment
        if: ${{ !cancelled() }}
        run: python3 .github/integration_jobs.py --check
      - name: Install actionlint 1.7.12
        if: ${{ !cancelled() }}
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" actionlint
      - name: Actionlint
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes='
      - name: Typos
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@v1.47.0
        with:
          config: pyproject.toml

  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Protect shipped source
        run: chmod -R a-w manager/src linear-orchestrator/src delegate/src session/src utils/src
      - name: Unit tests
        run: python3 -X faulthandler .github/run_tests.py Unit --unit
      - name: Require unchanged checkout
        if: ${{ always() }}
        run: |
          status=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null status --porcelain)
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

  coverage:
    name: Coverage
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned coverage
        run: python3 -m pip install coverage==7.10.7
      - name: Protect shipped source
        run: chmod -R a-w manager/src linear-orchestrator/src delegate/src session/src utils/src
      - name: Unit tests under coverage
        run: RUN_TESTS_COVERAGE="$RUNNER_TEMP/coverage-data" python3 -X faulthandler .github/run_tests.py Unit --unit
      - name: Diff coverage of changed src lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/coverage_gate.py "$RUNNER_TEMP/coverage-data" "origin/$BASE_REF"
      - name: Require unchanged checkout
        if: ${{ always() }}
        run: |
          status=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null status --porcelain)
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

  integration:
    name: Integration ${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        job: ["1", "2", "3", "4", "5", "6", "7", "8"]
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
      - name: Protect shipped source
        run: chmod -R a-w manager/src linear-orchestrator/src delegate/src session/src utils/src
      - name: Integration tests
        run: python3 -X faulthandler .github/integration_jobs.py '${{ matrix.job }}'
      - name: Require unchanged checkout
        if: ${{ always() }}
        run: |
          status=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null status --porcelain)
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

  ci:
    name: CI
    needs: [lint, unit, coverage, integration]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check and test job
        run: |
          test '${{ needs.lint.result }}' = success
          test '${{ needs.unit.result }}' = success
          if [[ '${{ github.event_name }}' = pull_request ]]; then
            test '${{ needs.coverage.result }}' = success
          else
            test '${{ needs.coverage.result }}' = skipped
          fi
          test '${{ needs.integration.result }}' = success
