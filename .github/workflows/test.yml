name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comment-budget:
    name: Comment budget v2.0 (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}/delegate/src:${{ github.workspace }}/session/src:${{ github.workspace }}/utils/src:${{ github.workspace }}/manager/src:${{ github.workspace }}/linear-orchestrator/src
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Comment budget
        run: python3 .github/comment_budget.py
      - name: Integration job assignment
        run: python3 .github/integration_jobs.py --check
      - name: .github tests
        run: python3 -m unittest discover -v -s .github -p "*_test.py"

  ruff:
    name: Ruff v2.0 (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        id: ruff
        run: pip install ruff==0.16.9
      - name: Ruff check
        run: ruff check --output-format=github
      - name: Ruff format
        if: ${{ !cancelled() && steps.ruff.outcome == 'success' }}
        run: ruff format --check

  unit:
    name: Unit ${{ matrix.project }} v2.0 (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: repo, tests: tests}
          - {project: delegate, tests: delegate/tests}
          - {project: session, tests: session/tests}
          - {project: utils, tests: utils/tests}
          - {project: manager, tests: manager/tests}
          - {project: linear-orchestrator, tests: linear-orchestrator/tests}
    env:
      PYTHONPATH: ${{ github.workspace }}/delegate/src:${{ github.workspace }}/session/src:${{ github.workspace }}/utils/src:${{ github.workspace }}/manager/src:${{ github.workspace }}/linear-orchestrator/src
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s '${{ matrix.tests }}/unit' -t . -p "*_test.py"

  integration:
    name: Integration ${{ matrix.job }} v2.0 (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        job: ["session 1", "session 2", "delegate", "linear-orchestrator", "manager 1", "manager 2", "manager 3", "repo"]
    env:
      PYTHONPATH: ${{ github.workspace }}/delegate/src:${{ github.workspace }}/session/src:${{ github.workspace }}/utils/src:${{ github.workspace }}/manager/src:${{ github.workspace }}/linear-orchestrator/src
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
      - name: Integration tests
        run: python3 .github/integration_jobs.py '${{ matrix.job }}'
