name: Codex synthetic probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mounts:
    name: Codex synthetic mounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test nested volatile home with persistent sessions
        run: bash scripts/docker-codex-mount-probe.sh

  native:
    name: Codex A probe image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Download verified native binary into credential-free build context
        run: |
          mkdir -m 700 "$RUNNER_TEMP/codex-image"
          python3 -I scripts/docker_codex_probe.py native --platform linux-x64 --destination "$RUNNER_TEMP/codex-image/codex"
      - name: Build and probe native version without credentials
        run: |
          docker build --network=none --file scripts/docker-codex-probe.Dockerfile --tag task647-codex-probe:0.163.0 "$RUNNER_TEMP/codex-image"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges task647-codex-probe:0.163.0 codex --version
