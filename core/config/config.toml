# Core pack config. A task's value overrides its role's, which overrides the global one.
#   tier       model tier 1–4 (1 = strongest); each [clients.<name>] table maps it to a model
#   effort     low | medium | high | xhigh | max; each [clients.<name>] table maps it to the client's effort
#   templates  files under templates/ inlined into the prompt
#   read       extra dirs the agent run reads; `repo` is the target repo's worktree, {{methods}} core's team/methods/ dir.
#              Read-only by the prompt only: no deny rules
#   write      extra dirs the agent run writes; the workdir is always reachable
#   commands   shell commands the driver pre-approves, in the client's rule syntax (a trailing ` *` matches any arguments);
#              {{scripts}} is core's src/ dir, {{workdir}} the agent run's workdir
#   gate       a usage-gate command a task runs before a costly step (deep research: before a second round); pre-approved; unset → none
#   language   optional; the language reports and PRDs are written in (one line); unset → no language rule, the model's default
#   show       tui runner: the shell command that shows the live session, {{session}} = the tmux session; one line, same trust as
#              `commands`. unset → $TUI_SHOW, else the built-in split (iTerm2, else tmux); "" → the attach line only (show > TUI_SHOW > split)
#   output     destination: type = github (repo, branch, dir, host: default github.com) | local | pull-request
#   users      global only: GitHub logins whose PR comments are the user's; unset → the gh login
#   symlink_clones  global only: local clones (absolute or ~ path) whose worktrees check out symlinks as links, matched by
#              real path; every other checkout, a skill's bundled repo.py included, gets core.symlinks=false. A listed clone
#              trusts every link in fetched origin/<branch> commits, which may point outside the worktree: list only stable
#              paths only you write. An agent run cannot add one (no flag; the overlay rejects it)
#   clients    global only: per-client tables, see the Clients section

# ── Global ──────────────────────────────────────────────
tier = 2
effort = "high"
language = "Chinese"
# show = "my-show {{session}}"
# users = ["octocat"]
# symlink_clones = ["~/data-repo"]

[output]
type = "local"

# ── Researcher ──────────────────────────────────────────
[roles.researcher]
default_task = "deep-research"

[roles.researcher.tasks.deep-research]
templates = ["research-report"]
read = ["{{methods}}"]
commands = ["python3 {{scripts}}/repo.py worktree --dir {{workdir}}/src *"]

[roles.researcher.tasks.deep-research.output]
type = "github"
repo = "ophis/private_docs"
# host = "github.com"       # default; set for GitHub Enterprise
branch = "main"
dir = "Research/"

[roles.researcher.tasks.light-research]
templates = ["research-report"]
commands = ["python3 {{scripts}}/repo.py worktree --dir {{workdir}}/src *"]

[roles.researcher.tasks.light-research.output]
type = "github"
repo = "ophis/private_docs"
# host = "github.com"       # default; set for GitHub Enterprise
branch = "main"
dir = "Research/"

# ── PM ──────────────────────────────────────────────────
[roles.pm]
default_task = "product-design"

[roles.pm.tasks.product-design]
templates = ["prd"]
commands = ["python3 {{scripts}}/repo.py worktree --dir {{workdir}}/src *"]

[roles.pm.tasks.product-design.output]
type = "github"
repo = "ophis/private_docs"
# host = "github.com"       # default; set for GitHub Enterprise
branch = "main"
dir = "Product Design/"

# ── Engineer ────────────────────────────────────────────
[roles.engineer]
default_task = "engineering"

[roles.engineer.tasks.engineering]
effort = "xhigh"
commands = ["python3 {{scripts}}/repo.py worktree --dir {{workdir}}/src *", "python3 {{scripts}}/repo.py status --dir {{workdir}}/src *"]

[roles.engineer.tasks.engineering.output]
type = "pull-request"

# ── Dummy Tester ────────────────────────────────────────
[roles.dummy-tester]
default_task = "echo"

[roles.dummy-tester.tasks.echo]
tier = 4
effort = "low"

[roles.dummy-tester.tasks.prepare-test]
tier = 4
effort = "low"
commands = ["python3 {{scripts}}/repo.py worktree --dir {{workdir}}/src *"]

# ── Clients ─────────────────────────────────────────────
# Claude Code client data, read by ClaudeClient (src/clients/claude.py); how argv is built lives there.
# Same layout as the tables above: a value under [clients.claude.roles.<role>.tasks.<task>] beats
# [clients.claude.roles.<role>], which beats [clients.claude].
[clients.claude]
flags = ["--permission-mode", "auto", "--setting-sources", "user", "--strict-mcp-config"]
# allow = ["<rule>"]   # extra --allowedTools rules in Claude Code syntax; [clients.claude], its roles.<role> or roles.<role>.tasks.<task>

[clients.claude.tiers]
1 = "fable"
2 = "opus"
3 = "sonnet"
4 = "haiku"

[clients.claude.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

[clients.claude.env]
CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS = "3600000"   # claude -p otherwise kills a workflow after 10 idle minutes

# Skill client data, read by SkillClient (src/clients/skill.py).

# Same layout as the tables above; an entry here replaces the same one there. A skill's description is its task file's
# frontmatter `description` (core/CLAUDE.md).
#   output       orchestrator → the deliverable goes back to the orchestrator; tasks without an entry keep their own (engineering: pull-request)
[clients.skill]

# ── Researcher ─────────────────────────────────────────
[clients.skill.roles.researcher.tasks.deep-research.output]
type = "orchestrator"

[clients.skill.roles.researcher.tasks.light-research.output]
type = "orchestrator"

# ── PM ─────────────────────────────────────────────────
[clients.skill.roles.pm.tasks.product-design.output]
type = "orchestrator"

# ── Dummy Tester ───────────────────────────────────────
[clients.skill.roles.dummy-tester.tasks.echo.output]
type = "orchestrator"

[clients.skill.roles.dummy-tester.tasks.prepare-test.output]
type = "orchestrator"
