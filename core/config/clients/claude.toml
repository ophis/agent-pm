# Claude Code client data, read by ClaudeClient (scripts/clients/claude.py); how argv is built lives there.
# Same layout as config.toml: a value under [roles.<role>.tasks.<task>] beats [roles.<role>], which beats the top.
flags = ["--permission-mode", "auto", "--setting-sources", "user", "--strict-mcp-config"]

[tiers]
1 = "fable"
2 = "opus"
3 = "sonnet"
4 = "haiku"

[efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

[env]
CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS = "3600000"   # claude -p otherwise kills a workflow after 10 idle minutes

# allow = ["<rule>"]   # extra --allowedTools rules in Claude Code syntax; top, [roles.<role>] or [roles.<role>.tasks.<task>]
