# This machine's core settings. Copy to core/config.local.toml (gitignored) and fill it in. It is read on top of
# config.toml: tables merge key by key, the local value wins, a list is replaced whole (repeat the items you keep); a
# table cannot drop a key config.toml sets, so a local [output] keeps the other keys of config.toml's at that level.

# ── Global ──────────────────────────────────────────────
#   show            tui runner only: how the agent run's TUI window opens.
#                   unset        → split the current pane (iTerm2, else tmux)
#                   ""           → open nothing; print the `tmux attach` command
#                   "<command>"  → run it; {{session}} is the tmux session name
#   cwd             the dir the agent run starts in (absolute or ~ path); unset → the caller's current directory (the
#                   orchestrator's runs: the workdir). A resume reuses its recorded one (<workdir>/run.json)
#   users           global only: GitHub logins whose PR comments are the user's; unset → the gh login
#   trusted_dirs    global only: dirs you trust (absolute or ~ path, matched by real path); unset → none. A cwd that is
#                   one or under one loads its project settings; any other, user settings only, with a stderr notice
#                   unless it is the workdir; a trusted cwd in the workdir is refused. A listed local clone's worktrees
#                   check out symlinks as links; every other checkout, a skill's bundled repo.py included, gets
#                   core.symlinks=false. A listed clone trusts every link in fetched origin/<branch> commits, which may
#                   point outside the worktree: list only stable paths only you write. An agent run cannot add one (no
#                   flag; the overlay rejects it)
#   tier            see config.toml; default config.toml's 2, e.g. tier = 1
#   effort          see config.toml; default config.toml's "high", e.g. effort = "xhigh"
#   language        see config.toml; default config.toml's "Chinese", e.g. language = "English"
# show = ""   # e.g. on a server: no window, attach by hand
# cwd = "~/src/<name>"
# users = ["octocat"]
# trusted_dirs = ["~/src/<name>"]

# Destination: [output] at any level; see config.toml.
#   type    see config.toml; default config.toml's per level (global "local"), e.g. type = "local"
#   repo    see config.toml; default config.toml's per task, e.g. repo = "<owner>/<name>"
#   branch  see config.toml; default config.toml's per task, e.g. branch = "main"
#   dir     see config.toml; default config.toml's per task, e.g. dir = "Research/"
#   host    see config.toml; default unset → github.com, e.g. host = "ghe.example.com"
# [roles.researcher.tasks.deep-research.output]
# repo = "<owner>/<name>"

# Roles: [roles.<role>] and [roles.<role>.tasks.<task>].
#   default_task  see config.toml; default config.toml's per role, e.g. default_task = "light-research"
#   templates     see config.toml; default config.toml's per task, else unset → none, e.g. templates = ["prd"]
#   read          see config.toml; default config.toml's per task, else unset → none, e.g. read = ["~/src/<name>"]
#   write         see config.toml; default unset → none, e.g. write = ["~/src/<name>"]
#   commands      see config.toml; default config.toml's per task, else unset → none, e.g. commands = ["make test *"]
#   gate          see config.toml; default unset → none (the orchestrator's overlay sets deep-research's), e.g.
#                 gate = "<usage-gate command>"
#   <run key>     tier, effort, language, show, cwd or [output] as above, for that role or task
# [roles.researcher.tasks.deep-research]
# cwd = "~/src/<name>"

# Clients: [clients.<name>]; see config.toml.
#   flags    see config.toml; default config.toml's ["--permission-mode", "auto", "--strict-mcp-config"], e.g.
#            flags = ["--permission-mode", "auto", "--strict-mcp-config", "--debug"]
#   allow    see config.toml; default unset → none, e.g. allow = ["Bash(make test *)"]
#   tiers    see config.toml; default config.toml's 1 "fable", 2 "opus", 3 "sonnet", 4 "haiku", e.g. 3 = "opus"
#   efforts  see config.toml; default config.toml's: each effort its own name, e.g. max = "xhigh"
#   env      see config.toml; default config.toml's CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS = "3600000", e.g.
#            CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS = "7200000"
#   output   [clients.skill] per task: see config.toml; default config.toml's, e.g. type = "orchestrator"
#   <run key>  any run key above, in the same layout
# [clients.claude.tiers]
# 3 = "opus"
