# DO NOT MODIFY this file. This machine's settings go in ~/.agent-pm/core.local.toml, read on top of this file: create
# it and copy in the lines marked `# local:` below, uncommented, with your values. It may override any other key too:
# tables merge key by key, the local value wins, a list is replaced whole (repeat the items you keep); a table cannot
# drop a key this file sets, so a local [output] keeps this file's other keys at that level.
#
# A run key's value resolves in order, each step replacing what the earlier ones set:
#   layers  this file (core.local.toml on top) → the client's [clients.<name>] → the orchestrator's [core] overlay; so
#           a later layer's global value beats an earlier layer's role value
#   levels  within a layer: global → role ([roles.<role>])

# ── Global ──────────────────────────────────────────────
#   tier            required: model tier 1–4 (1 = strongest); [clients.<name>] maps it to a model
#   effort          required: low | medium | high | xhigh | max; [clients.<name>] maps it to the client's effort
#   language        the language reports and PRDs are written in (one line); unset → no rule: the model's default
#   show            local: tui runner only: how the agent run's TUI window opens.
#                   unset        → open a pane: a tmux grid, else stacked (core/CLAUDE.md › Rules: the built-in show)
#                   ""           → open nothing; print the `tmux attach` command
#                   "<command>"  → run it; {{session}} is the tmux session name
#   cwd             local: the dir the agent run starts in (absolute or ~ path); unset → the caller's current directory
#                   (the orchestrator's runs: the workdir). A resume reuses its recorded one (<workdir>/run.jsonl)
#   users           local, global only: GitHub logins whose PR comments are the user's; unset → the gh login
#   trusted_dirs    local, global only: dirs you trust (absolute or ~ path, matched by real path); unset → none. A cwd
#                   that is one or under one loads its project settings; any other, user settings only, with a stderr
#                   notice unless it is the workdir; a trusted cwd in the workdir is refused. A listed local clone's
#                   worktrees check out symlinks as links; every other checkout gets core.symlinks=false. A listed
#                   clone trusts every link in fetched origin/<branch> commits, which may point outside the worktree:
#                   list only stable paths only you write. An agent run cannot add one (no flag; the overlay rejects it)
#   status_line     local, global only: true → TUI sessions (the tui runner's, the tmux skill's workers) show tmux's
#                   status line; unset → false
#   workers_per_column local, global only: worker panes per grid column (tmux grid), 1..9999; unset → 3
tier = 2
effort = "high"
language = "English"
# local: language = "Chinese"
# local: show = ""   # e.g. on a server: no window, attach by hand
# local: cwd = "~/src/<name>"
# local: users = ["octocat"]
# local: trusted_dirs = ["~/src/<name>"]
# local: status_line = true
# local: workers_per_column = 2

# Destination; a lower level's [output] replaces the whole table.
#   type    required: github (publish to repo, branch, dir) | local (save to drive.py's --out) | pull-request (a PR on
#           the target repo) | orchestrator (return it in the outcome only)
#   repo    github: required; <owner>/<name>
#   branch  github: required
#   dir     github: required; the folder in the repo
#   host    github: unset → github.com; set for GitHub Enterprise, e.g. "ghe.example.com"
# The orchestrator needs researcher's and pm's [output] on one github.com repo and branch (local: below).
[output]
type = "local"

# Roles: [roles.<role>], a role's run keys; its tasks are its charter's index (team/roles/<role>.md › Tasks). A role
# table holding the old task-level keys is an error (README › Task labels: Upgrade).
#   templates     names of team/templates/*.md inlined into the prompt; unset → none
#   read          extra dirs the agent run reads; `repo` is drive.py's --repo dir, {{methods}} core's team/methods/
#                 dir; core's team/tasks/ is always read. Read-only by the prompt only: no deny rules. unset → none
#   write         extra dirs the agent run writes; the workdir is always reachable; unset → none
#   commands      shell commands the driver pre-approves, in the client's rule syntax (a trailing ` *` matches any
#                 arguments); {{scripts}} is core's src/ dir, {{workdir}} the agent run's workdir; unset → none
#   gate          a usage-gate command the researcher runs before a costly step (deep research: before a second
#                 round); pre-approved; unset → none (the orchestrator's overlay sets researcher's, so every researcher
#                 run pre-approves it, light-research too)
#   <run key>     tier, effort, language, show, cwd or [output], for that role

# ── Researcher ──────────────────────────────────────────
[roles.researcher]
templates = ["research-report"]
read = ["{{methods}}"]
commands = ["python3 {{scripts}}/repo.py worktree --dir {{workdir}}/src *"]
# local: [roles.researcher]
# local: cwd = "~/src/<name>"
# local: [roles.researcher.output]
# local: type = "github"
# local: repo = "<owner>/<name>"
# local: branch = "main"
# local: dir = "Research/"

# ── PM ──────────────────────────────────────────────────
[roles.pm]
templates = ["prd"]
commands = ["python3 {{scripts}}/repo.py worktree --dir {{workdir}}/src *"]
# local: [roles.pm.output]
# local: type = "github"
# local: repo = "<owner>/<name>"
# local: branch = "main"
# local: dir = "Product Design/"

# ── Engineer ────────────────────────────────────────────
[roles.engineer]
effort = "xhigh"
commands = ["python3 {{scripts}}/repo.py worktree --dir {{workdir}}/src *", "python3 {{scripts}}/repo.py status --dir {{workdir}}/src *"]

[roles.engineer.output]
type = "pull-request"

# ── Dummy Tester ────────────────────────────────────────
[roles.dummy-tester]
tier = 3
effort = "low"

# ── Clients ─────────────────────────────────────────────
# [clients.<name>], global only: a client's data, plus run keys in the layout above.
# Claude Code, read by ClaudeClient (src/clients/claude.py); how argv is built lives there.
#   flags    [clients.claude] only: flags on every claude command; unset → none. --setting-sources is refused: the
#            driver sets it (trusted_dirs)
#   allow    extra --allowedTools rules in Claude Code syntax, at any level; unset → none
#   tiers    [clients.claude] only: tier → model; required for each tier a run uses
#   efforts  [clients.claude] only: effort → claude's --effort value; required for each effort a run uses
#   env      [clients.claude] only: variables added to the run's environment; unset → none.
#            CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: claude -p otherwise kills a workflow after 10 idle minutes
[clients.claude]
flags = ["--permission-mode", "auto", "--strict-mcp-config"]
# allow = ["<rule>"]

[clients.claude.tiers]
1 = "fable"
2 = "opus"
3 = "sonnet"
4 = "haiku"
# local: [clients.claude.tiers]
# local: 3 = "opus"

[clients.claude.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

[clients.claude.env]
CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS = "3600000"

# Skill client, read by SkillClient (src/clients/skill.py): the prompt `drive.py --client skill` prints for the calling
# conversation to follow (the act-as skill).
#   output  per role ([clients.skill.roles.<role>.output]); a role without one keeps its own (engineer: pull-request)
[clients.skill]

[clients.skill.roles.researcher.output]
type = "orchestrator"

[clients.skill.roles.pm.output]
type = "orchestrator"

[clients.skill.roles.dummy-tester.output]
type = "orchestrator"
