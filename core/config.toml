# Core pack config. A task's value overrides its role's, which overrides the global one.
#   tier       model tier 1–4 (1 = strongest); each client config (clients/<name>.toml) maps it to a model
#   effort     low | medium | high | xhigh | max; each client config maps it to the client's effort
#   templates  files under templates/ inlined into the prompt
#   read       extra dirs the run reads; `repo` is the target repo's worktree. Read-only by the prompt only: no deny rules
#   write      extra dirs the run writes; the workdir and the output file's dir are always reachable
#   commands   exact shell commands the driver pre-approves
#   output     destination: type = github (repo, branch, dir, host: default github.com) | local | pull-request

# ── Global ──────────────────────────────────────────────
tier = 2
effort = "high"

[output]
type = "local"

# ── Researcher ──────────────────────────────────────────
[roles.researcher]
default_task = "deep-research"

[roles.researcher.tasks.deep-research]
templates = ["research-report"]
read = ["repo"]

[roles.researcher.tasks.deep-research.output]
type = "github"
repo = "ophis/private_docs"
branch = "main"
dir = "Research/"

[roles.researcher.tasks.light-research]
templates = ["research-report"]
read = ["repo"]

[roles.researcher.tasks.light-research.output]
type = "github"
repo = "ophis/private_docs"
branch = "main"
dir = "Research/"

# ── PM ──────────────────────────────────────────────────
[roles.pm]
default_task = "product-design"

[roles.pm.tasks.product-design]
templates = ["prd"]

[roles.pm.tasks.product-design.output]
type = "github"
repo = "ophis/private_docs"
branch = "main"
dir = "Product Design/"

# ── Engineer ────────────────────────────────────────────
[roles.engineer]
default_task = "engineering"

[roles.engineer.tasks.engineering]
effort = "xhigh"
write = ["repo"]

[roles.engineer.tasks.engineering.output]
type = "pull-request"

# ── Dummy Tester ────────────────────────────────────────
[roles.dummy-tester]
default_task = "echo"

[roles.dummy-tester.tasks.echo]
tier = 4
effort = "low"
