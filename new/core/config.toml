# DO NOT MODIFY this file. This machine's settings go in ~/.agent-pm/core-new.local.toml, read on top of this file. It
# may override any key: tables merge key by key, the local value wins, a list is replaced whole (repeat the items you
# keep); a table cannot drop a key this file sets, so a local [adapters.<name>] keeps this file's other keys in that
# table.

# ── Adapters ────────────────────────────────────────────
# [adapters.<name>]  one table per runtime, read only by src/driver/registry.py; <name> is the runtime name
#                    driver.api.start takes and the package src/adapters/<name>/
#   implementation   required: "adapters.<name>:<Class>Adapter", the Adapter subclass of that package
#   any other key    the adapter's own (its class's `keys`); a key it does not list is a config error

# [adapters.claude]  Claude Code (src/adapters/claude/); each key optional
#   flags            claude flags added to every session command; never --setting-sources (the Driver's)
#   allow            tool rules pre-approved for every session (--allowedTools), after the run's own commands
#   env              variables added to every command's environment, over the adapter's defaults
# [adapters.claude.tiers]    tier "1".."4" → its --model
# [adapters.claude.efforts]  effort (low, medium, high, xhigh, max) → its --effort
#                            starting a run whose tier or effort has no entry here is a config error
[adapters.claude]
implementation = "adapters.claude:ClaudeAdapter"
flags = ["--permission-mode", "auto", "--strict-mcp-config"]
# allow = ["<rule>"]

[adapters.claude.tiers]
1 = "fable"
2 = "opus"
3 = "sonnet"
4 = "haiku"

[adapters.claude.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

[adapters.codex]
implementation = "adapters.codex:CodexAdapter"
shell_network = false

[adapters.codex.tiers]
1 = "gpt-6-astra"
2 = "gpt-6.1-sol"
3 = "gpt-6-luna"
4 = "gpt-5.6-terra"

[adapters.codex.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# Optional local env table supplies launch/probe variables, including CODEX_HOME; resume keeps the saved CODEX_HOME.
[adapters.codex.env]
