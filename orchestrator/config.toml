team = "06159b6b-5efe-4bc5-a27b-875701f40d61"   # Frank's Agents; Linear ids, since names change with a rename
human_members = ["ophis.w@outlook.com"]   # the human users; subscribed to every issue moved to In Review
harness_key = "linear-api-key"   # Keychain service of the harness account's Linear API key (router, promote, prune)
task_label_group = "66f375be-02ef-44d2-84cc-d11a280dc3ea"   # Linear id of the `Tasks` label group; its labels pick an issue's task through [task_labels]

# The team's workflow states the code uses, by Linear state id.
[states]
todo        = "717e27f7-c97e-43d8-aa47-13d513ad8ec6"
in_progress = "cda9dcfe-c2ab-4853-8e17-8d6ad76b0795"
in_review   = "5efb3bbc-ea0b-4982-a3d5-31338c9bade3"
handoff     = "6d876dc6-7732-4473-a0b2-30041d93d0aa"
done        = "414a4381-7260-46e7-8057-d8cec9d4b11f"
canceled    = "ed6093ef-3f2e-4e8e-bb59-65ec56ae1938"

# A task's Linear label (a child of the Tasks group), by label id: <task> = "<label id>". Default tasks need no entry.
[task_labels]
light-research = "7cb3a7cc-05b4-4dec-bbf8-d4fce87cea1d"   # Light Research

# A role: its Linear account and the Keychain service of that account's API key (write-back acts as it).
# Its tasks are core/config/config.toml's roles.<role>.tasks, default_task first.
# An issue assigned to the account runs the role's default task unless its Tasks label picks another through [task_labels].
[roles.researcher]
account = "frank.agent.w+researcher@gmail.com"
key = "linear-api-key-researcher"
next = "pm"                        # promote hands the role's Handoff issues to this role

[roles.pm]
account = "frank.agent.w+pm@gmail.com"
key = "linear-api-key-pm"
next = "engineer"
require_instructions = false       # a PRD carries enough context; Handoff comments are optional

[roles.engineer]                   # no next: the last stage
account = "frank.agent.w+engineer@gmail.com"
key = "linear-api-key-engineer"

# Target repo of an Engineering, research or product-design issue with no Repo: line, by its Linear project id; a Repo: line wins.
[project_repos]
"121166b1-191a-4461-bec4-42f1c2dc0ddd" = "ophis/agent-pm"           # Agent PM
"ae72ede7-67a6-469d-a959-8ea51ab71fb8" = "ophis/claude-autopilot"   # Autopilot

# Core run keys for the orchestrator's runs, in core/config/config.toml's layout under [core], applied after
# core/config/clients/claude.toml (drive.plan layers). pipeline.overlay() fills {{root}} with this repo's root.
[core.roles.researcher.tasks.deep-research]
gate = "python3 {{root}}/orchestrator/src/router.py --brake"
