# DO NOT MODIFY this file. This deployment's settings go in ~/.agent-pm/orchestrator.local.toml, read on top of this
# file: create it and copy in the lines marked `# local:` below, uncommented, with your values. It may override any
# other key too: tables merge key by key, the local value wins, a list is replaced whole; a table cannot drop a key
# this file sets. Missing required keys stop router, run and promote.

# Linear entities, by id.
#   team              local, required: the Linear team id
#   human_members     local: the human users' emails; each is subscribed to every issue moved to In Review; unset → none
#   harness_key       local, required: Keychain service of the harness account's Linear API key (router, promote, prune)
#   task_label_group  local, required: Linear id of the `Tasks` label group; its labels pick an issue's task through
#                     [task_labels]
#   work_dir          local: runtime state: agent runs' workdirs in <work_dir>/work/<ID>/, router state and logs in
#                     <work_dir>/logs/ (the plists hard-code it); absolute or ~, neither in nor containing this repo or a
#                     [local_clones] clone; unset → ~/.agent-pm
# local: team = "00000000-0000-0000-0000-000000000000"
# local: human_members = ["you@example.com"]
# local: harness_key = "linear-harness"
# local: task_label_group = "00000000-0000-0000-0000-000000000000"
# local: work_dir = "~/.agent-pm"

# The team's workflow states the code uses.
#   <state>  local, required for each of todo, in_progress, in_review, handoff, done, canceled: its Linear state id
# local: [states]
# local: todo        = "00000000-0000-0000-0000-000000000000"
# local: in_progress = "00000000-0000-0000-0000-000000000000"
# local: in_review   = "00000000-0000-0000-0000-000000000000"
# local: handoff     = "00000000-0000-0000-0000-000000000000"
# local: done        = "00000000-0000-0000-0000-000000000000"
# local: canceled    = "00000000-0000-0000-0000-000000000000"

# Task labels; optional, a default task needs none.
#   <task>  local: the task's Linear label id, a child of the Tasks group
# local: [task_labels]
# local: light-research = "00000000-0000-0000-0000-000000000000"
# local: light-build = "00000000-0000-0000-0000-000000000000"

# A role to orchestrate. Its tasks are core/config.toml's roles.<role>.tasks, default_task first. A role added in
# orchestrator.local.toml is orchestrated too.
#   account               local, required for each role: the role's Linear account (email)
#   key                   local, required: Keychain service of that account's API key
#   next                  the role promote hands this role's Handoff issues to; unset → the last stage
#   require_instructions  true → a Handoff issue with no human_members comment goes back to In Review; unset → true
#   max_runs              agent runs of this role at once; unset → 1
[roles.researcher]
next = "pm"
max_runs = 3

[roles.pm]
next = "engineer"
require_instructions = false       # a PRD carries enough context
max_runs = 3

[roles.engineer]
max_runs = 3

# local: [roles.researcher]
# local: account = "you+researcher@example.com"
# local: key = "linear-researcher"
# local: [roles.pm]
# local: account = "you+pm@example.com"
# local: key = "linear-pm"
# local: [roles.engineer]
# local: account = "you+engineer@example.com"
# local: key = "linear-engineer"
# local: max_runs = 1

# Project repos; optional.
#   "<project id>"  local: "<owner>/<name>": target repo of the Linear project's Engineering, research or
#                   product-design issues with no Repo: line; a Repo: line wins
# local: [project_repos]
# local: "00000000-0000-0000-0000-000000000000" = "<owner>/<name>"

# Local clones; optional, an unlisted repo gets a fresh clone.
#   "<owner>/<name>"  local: "<path>" (absolute or ~) of the repo's local clone. The input's Repo: line names the path,
#                     so the agent run gets a git worktree of the clone; config.runnable checks it is a clone of that repo
# local: [local_clones]
# local: "<owner>/<name>" = "~/src/<name>"

# The overlay; optional: core run keys for the orchestrator's agent runs, in core/config.toml's layout under
# [core], the last of core/config.toml's layers. config.overlay() fills {{root}} with this repo's root.
#   <run key>  as in core/config.toml, local keys included (e.g. a trusted cwd or a show command); users, trusted_dirs,
#              status_line, clients and default_task are refused
[core.roles.researcher.tasks.deep-research]
gate = "python3 {{root}}/orchestrator/src/router.py --brake"
# local: [core.roles.researcher]
# local: cwd = "~/src/<name>"
# local: show = ""
