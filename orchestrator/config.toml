# The orchestrator's generic config. This deployment's settings (Linear ids, accounts, Keychain items, repos, clones,
# work_dir) go in config.local.toml, read on top of this file: see config.local.example.toml.

# A role to orchestrate. Its tasks are core/config.toml's roles.<role>.tasks, default_task first. An issue
# assigned to its account runs the role's default task unless its Tasks label picks another through [task_labels].
#   next                  the role promote hands this role's Handoff issues to; unset → the last stage
#   require_instructions  true → a Handoff issue with no human_members comment goes back to In Review; unset → true
#   max_runs              agent runs of this role at once; unset → 1
[roles.researcher]
next = "pm"
max_runs = 3

[roles.pm]
next = "engineer"
require_instructions = false       # a PRD carries enough context
max_runs = 3

[roles.engineer]
max_runs = 3

# The overlay; optional: core run keys for the orchestrator's agent runs, in core/config.toml's layout under
# [core], applied after core/config.toml's [clients.claude] (drive.plan layers). config.overlay() fills {{root}}
# with this repo's root.
#   <run key>  as in core/config.toml and core/config.local.example.toml; users, trusted_dirs and clients are refused
[core.roles.researcher.tasks.deep-research]
gate = "python3 {{root}}/orchestrator/src/router.py --brake"
